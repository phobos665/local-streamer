# Builds the Tauri app for Windows (NSIS installer) and macOS (universal .dmg)
# and attaches both to one GitHub release.
#
# To release: push a version tag, e.g.
#   git tag v0.2.0
#   git push origin v0.2.0
# The tag's version (0.2.0) is written into tauri.conf.json before building,
# so the installers and the app's version match the tag.
#
# The release is created as a draft. Check it on GitHub, then press "Publish".

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 (created on the selected branch if it doesn't exist)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # One draft release up front, so the platform builds upload into the same
  # release instead of racing to create it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Check tag
        run: |
          if ! [[ "${TAG#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+].*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            Local Streamer ${{ env.TAG }}.

            **Windows:** download `Local Streamer_*_x64-setup.exe` and run it.
            Needs the WebView2 runtime (included with Windows 11; the installer fetches it if missing).

            **macOS (12 or later, Apple Silicon and Intel):** download `Local Streamer_*_universal.dmg`
            and drag the app to Applications. The app isn't notarized, so the first launch is blocked:
            open System Settings → Privacy & Security and press "Open Anyway"
            (or run `xattr -dr com.apple.quarantine "/Applications/Local Streamer.app"`).
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Local Streamer $TAG" \
            -f body="$BODY" \
            -F draft=true \
            -F prerelease=false \
            --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "Created draft release $id for $TAG"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            rust_targets: ""
            args: ""
          - name: macos
            os: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tauri

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri/src-tauri -> target

      - name: Set app version from tag
        shell: bash
        run: |
          VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          ' "$VERSION"
          echo "Building version $VERSION"

      - name: Install npm dependencies
        run: npm ci

      - name: Build and upload to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: tauri
          tauriScript: npm run tauri
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
